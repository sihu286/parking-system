<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3f6f"/>
      <stop offset="100%" style="stop-color:#1a2d54"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5577f0"/>
      <stop offset="100%" style="stop-color:#3a5be0"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Body (clipped to circle) -->
  <g clip-path="url(#circle)">
    <!-- Head -->
    <circle cx="32" cy="24" r="10" fill="url(#body)"/>
    <!-- Shoulders -->
    <ellipse cx="32" cy="54" rx="18" ry="14" fill="url(#body)"/>
  </g>
</svg>
